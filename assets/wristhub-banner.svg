<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">WristHub</title>
  <desc id="desc">Universal BONELAB wrist menu for PCVR and Quest</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b12"/>
      <stop offset="0.55" stop-color="#151222"/>
      <stop offset="1" stop-color="#071a1e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18"/>
      <stop offset="0.48" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#25e6d4"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21160f"/>
      <stop offset="1" stop-color="#09262a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="34" fill="url(#grid)"/>
  <circle cx="1090" cy="30" r="215" fill="#21dfce" opacity=".07"/>
  <circle cx="74" cy="344" r="245" fill="#ff7a18" opacity=".09"/>
  <g transform="translate(72 48)">
    <rect x="62" y="-28" width="104" height="72" rx="28" fill="#171820" stroke="#ff862b" stroke-width="5"/>
    <rect x="62" y="220" width="104" height="72" rx="28" fill="#171820" stroke="#20dcca" stroke-width="5"/>
    <rect x="0" y="20" width="228" height="232" rx="54" fill="#07090e" stroke="url(#brand)" stroke-width="7" filter="url(#glow)"/>
    <rect x="18" y="38" width="192" height="196" rx="39" fill="url(#face)" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="114" cy="136" r="54" fill="none" stroke="#ff8128" stroke-width="11" stroke-dasharray="85 20"/>
    <path d="M86 141l20 20 43-50" fill="none" stroke="#28e4d2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="114" cy="136" r="73" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  </g>
  <g transform="translate(370 82)">
    <text x="0" y="74" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="8">WRISTHUB</text>
    <rect x="3" y="94" width="648" height="7" rx="3.5" fill="url(#brand)"/>
    <text x="2" y="144" fill="#d8dbe5" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="2">THE ALL-IN-ONE BONELAB WRIST MENU</text>
    <g transform="translate(2 178)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
      <rect width="192" height="48" rx="24" fill="#ff7a18" fill-opacity=".14" stroke="#ff8d35" stroke-width="2"/>
      <text x="96" y="31" fill="#ffad64" text-anchor="middle">PCVR + QUEST</text>
      <rect x="210" width="170" height="48" rx="24" fill="#21ddca" fill-opacity=".12" stroke="#27dac9" stroke-width="2"/>
      <text x="295" y="31" fill="#6df2e6" text-anchor="middle">UNIVERSAL</text>
      <rect x="398" width="248" height="48" rx="24" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16" stroke-width="2"/>
      <text x="522" y="31" fill="#f0f1f6" text-anchor="middle">BUILT FOR FUSION</text>
    </g>
  </g>
</svg>