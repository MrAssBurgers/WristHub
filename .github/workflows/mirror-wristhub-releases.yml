name: Mirror WristHub releases

on:
  # A workflow-file sync also wakes the mirror immediately when GitHub's schedule is delayed.
  # Latest manual publish wake: Dev Build 216 (440216).
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-wristhub-releases.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wristhub-release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror signed WristHub packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://wristhub-api.wristhub.workers.dev/v1/releases"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          for channel in stable beta dev; do
            pcvr="$work/manifest-pcvr.json"
            quest="$work/manifest-quest.json"
            if ! curl --fail --silent --show-error --retry 3 \
              "$base/$channel/pcvr/manifest.json" -o "$pcvr"; then
              continue
            fi
            if ! curl --fail --silent --show-error --retry 3 \
              "$base/$channel/quest/manifest.json" -o "$quest"; then
              continue
            fi

            sequence="$(jq -r '.releaseSequence // 0' "$pcvr")"
            quest_sequence="$(jq -r '.releaseSequence // 0' "$quest")"
            if [[ "$sequence" == "0" || "$sequence" != "$quest_sequence" ]]; then
              echo "Skipping $channel: platform manifests are not one universal release yet."
              continue
            fi

            tag="wristhub-$channel-$sequence"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already mirrored."
              continue
            fi

            download_url="$(jq -r '.downloadUrl' "$pcvr")"
            version="$(jq -r '.version' "$pcvr")"
            release_label="$(jq -r '.releaseLabel' "$pcvr")"
            if [[ "$channel" == "stable" ]]; then
              archive_name="WristHub-v${version}-Official-Release.zip"
            else
              build="$(sed -nE 's/.*DEV BUILD ([0-9]+).*/\1/ip' <<<"$release_label")"
              [[ -n "$build" ]]
              archive_name="WristHub-v${version}-Dev-Build-${build}.zip"
            fi
            archive="$work/$archive_name"
            curl --fail --location --silent --show-error --retry 4 \
              "$download_url" -o "$archive"

            expected_size="$(jq -r '.sizeBytes' "$pcvr")"
            actual_size="$(stat -c '%s' "$archive")"
            expected_hash="$(jq -r '.sha256' "$pcvr" | tr '[:upper:]' '[:lower:]')"
            actual_hash="$(sha256sum "$archive" | cut -d' ' -f1)"
            [[ "$actual_size" == "$expected_size" ]]
            [[ "$actual_hash" == "$expected_hash" ]]

            notes="$work/notes.txt"
            jq -r '.notes // "WristHub update"' "$pcvr" > "$notes"
            gh release create "$tag" "$archive" "$pcvr" "$quest" \
              --title "WristHub $(jq -r '.releaseLabel' "$pcvr")" \
              --notes-file "$notes" \
              $( [[ "$channel" == "stable" ]] || printf '%s' '--prerelease' )

            # Releases created with GitHub's workflow token do not emit another release workflow.
            # Dispatch the same tag explicitly so the free Discord announcement workflow handles
            # mirrored builds, while manually published GitHub releases use its normal release hook.
            dispatch="$work/discord-dispatch.json"
            jq -n --arg tag "$tag" \
              '{event_type:"wristhub-release-published",client_payload:{tag:$tag}}' > "$dispatch"
            gh api --method POST "repos/$GH_REPO/dispatches" --input "$dispatch"
          done

          # GitHub does not provide a rename button for release assets in its normal UI, but its
          # release API can safely rename the asset without changing its bytes or digest. Backfill
          # every mirrored WristHub release so old sequence-only names disappear as well.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | \
            grep -E '^wristhub-(stable|beta|dev)-[0-9]+$' | while read -r tag; do
              release_json="$work/release.json"
              gh api "repos/$GH_REPO/releases/tags/$tag" > "$release_json"
              manifest_url="$(jq -r '.assets[] | select(.name == "manifest-pcvr.json") | .browser_download_url' "$release_json" | head -n1)"
              [[ -n "$manifest_url" ]] || continue
              manifest="$work/backfill-manifest.json"
              curl --fail --location --silent --show-error --retry 3 "$manifest_url" -o "$manifest"

              version="$(jq -r '.version' "$manifest")"
              channel="$(cut -d- -f2 <<<"$tag")"
              if [[ "$channel" == "stable" ]]; then
                friendly_name="WristHub-v${version}-Official-Release.zip"
              else
                build="$(jq -r '.releaseLabel' "$manifest" | sed -nE 's/.*DEV BUILD ([0-9]+).*/\1/ip')"
                [[ -n "$build" ]] || continue
                friendly_name="WristHub-v${version}-Dev-Build-${build}.zip"
              fi

              asset_id="$(jq -r --arg name "$friendly_name" \
                '[.assets[] | select(.name | endswith(".zip")) | select(.name != $name)][0].id // empty' \
                "$release_json")"
              if [[ -n "$asset_id" ]]; then
                echo "Renaming $tag package to $friendly_name"
                gh api --method PATCH "repos/$GH_REPO/releases/assets/$asset_id" \
                  -f name="$friendly_name" >/dev/null
              fi
            done

