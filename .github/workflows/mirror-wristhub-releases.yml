name: Legacy Cloudflare release mirror

on:
  # GitHub-direct publishing is authoritative. This workflow is retained only for an operator to
  # recover one legacy Cloudflare release during the final migration; it never polls automatically.
  workflow_dispatch:
    inputs:
      confirm_legacy_mirror:
        description: Mirror one pending legacy Cloudflare release into GitHub
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: wristhub-release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ inputs.confirm_legacy_mirror == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Mirror signed WristHub packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://wristhub-api.wristhub.workers.dev/v1/releases"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          dispatch_discord() {
            local tag="$1"
            local dispatch="$work/discord-dispatch.json"
            jq -n --arg tag "$tag" \
              '{event_type:"wristhub-release-published",client_payload:{tag:$tag}}' > "$dispatch"
            gh api --method POST "repos/$GH_REPO/dispatches" --input "$dispatch"
          }

          find_release_including_drafts() {
            local tag="$1"
            local destination="$2"
            local listing="$work/releases-for-lookup.json"
            local matches

            # GET /releases/tags/{tag} intentionally excludes drafts. List every authenticated
            # release page instead, then select the exact tag so an interrupted draft is resumed.
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" > "$listing"
            matches="$(jq -s --arg tag "$tag" \
              '[.[][] | select(.tag_name == $tag)] | length' "$listing")"
            if [[ "$matches" == "0" ]]; then
              rm -f "$destination"
              return 1
            fi
            if [[ "$matches" != "1" ]]; then
              echo "Refusing to mirror $tag: found $matches releases with that exact tag." >&2
              return 2
            fi
            jq -s --arg tag "$tag" \
              '[.[][] | select(.tag_name == $tag)][0]' "$listing" > "$destination"
          }

          for channel in stable beta dev; do
            pcvr="$work/manifest-pcvr.json"
            quest="$work/manifest-quest.json"
            if ! curl --fail --silent --show-error --retry 3 \
              "$base/$channel/pcvr/manifest.json" -o "$pcvr"; then
              continue
            fi
            if ! curl --fail --silent --show-error --retry 3 \
              "$base/$channel/quest/manifest.json" -o "$quest"; then
              continue
            fi

            sequence="$(jq -r '.releaseSequence // 0' "$pcvr")"
            quest_sequence="$(jq -r '.releaseSequence // 0' "$quest")"
            if [[ "$sequence" == "0" || "$sequence" != "$quest_sequence" ]]; then
              echo "Skipping $channel: platform manifests are not one universal release yet."
              continue
            fi

            tag="wristhub-$channel-$sequence"
            existing_release="$work/existing-$channel.json"
            release_exists=false
            lookup_status=0
            find_release_including_drafts "$tag" "$existing_release" || lookup_status=$?
            if [[ "$lookup_status" == "0" ]]; then
              release_exists=true
              if [[ "$(jq -r '.draft' "$existing_release")" == "false" ]]; then
                marker="<!-- wristhub-discord-announced:${tag} -->"
                body="$(jq -r '.body // ""' "$existing_release")"
                if [[ "$body" != *"$marker"* ]]; then
                  # Recover a rare failed announcement. The Discord workflow owns the durable
                  # per-tag receipt and its concurrency group safely collapses simultaneous retries.
                  dispatch_discord "$tag"
                  echo "$tag is complete; queued its missing Discord receipt."
                else
                  echo "$tag is already mirrored and announced."
                fi
                continue
              fi
              echo "Resuming incomplete draft $tag."
            elif [[ "$lookup_status" != "1" ]]; then
              exit "$lookup_status"
            fi

            download_url="$(jq -r '.downloadUrl' "$pcvr")"
            version="$(jq -r '.version' "$pcvr")"
            release_label="$(jq -r '.releaseLabel' "$pcvr")"
            if [[ "$channel" == "stable" ]]; then
              archive_name="WristHub-v${version}-Official-Release.zip"
            else
              build="$(sed -nE 's/.*DEV BUILD ([0-9]+).*/\1/ip' <<<"$release_label")"
              [[ -n "$build" ]]
              archive_name="WristHub-v${version}-Dev-Build-${build}.zip"
            fi
            archive="$work/$archive_name"
            curl --fail --location --silent --show-error --retry 4 \
              "$download_url" -o "$archive"

            expected_size="$(jq -r '.sizeBytes' "$pcvr")"
            actual_size="$(stat -c '%s' "$archive")"
            expected_hash="$(jq -r '.sha256' "$pcvr" | tr '[:upper:]' '[:lower:]')"
            actual_hash="$(sha256sum "$archive" | cut -d' ' -f1)"
            [[ "$actual_size" == "$expected_size" ]]
            [[ "$actual_hash" == "$expected_hash" ]]

            notes="$work/notes.txt"
            jq -r '.notes // "WristHub update"' "$pcvr" > "$notes"
            release_title="WristHub $(jq -r '.releaseLabel' "$pcvr")"
            prerelease=false
            [[ "$channel" == "stable" ]] || prerelease=true
            if [[ "$release_exists" == "false" ]]; then
              # Keep the release private until every byte is uploaded and verified. Publishing the
              # empty shell would let users and announcement jobs race incomplete assets.
              create_payload="$work/create-$channel.json"
              jq -n --arg tag "$tag" --arg name "$release_title" --rawfile body "$notes" \
                --argjson prerelease "$prerelease" \
                '{tag_name:$tag,name:$name,body:$body,draft:true,prerelease:$prerelease}' \
                > "$create_payload"
              gh api --method POST "repos/$GH_REPO/releases" --input "$create_payload" \
                > "$existing_release"
            else
              release_id="$(jq -r '.id' "$existing_release")"
              draft_payload="$work/update-draft-$channel.json"
              jq -n --arg name "$release_title" --rawfile body "$notes" \
                --argjson prerelease "$prerelease" \
                '{name:$name,body:$body,draft:true,prerelease:$prerelease}' \
                > "$draft_payload"
              gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
                --input "$draft_payload" > "$existing_release"
            fi
            release_id="$(jq -r '.id' "$existing_release")"
            [[ "$release_id" =~ ^[0-9]+$ ]]
            [[ "$(jq -r '.tag_name' "$existing_release")" == "$tag" ]]
            [[ "$(jq -r '.draft' "$existing_release")" == "true" ]]
            gh release upload "$tag" "$archive" "$pcvr" "$quest" --clobber

            complete_release="$work/complete-$channel.json"
            gh api "repos/$GH_REPO/releases/$release_id" > "$complete_release"
            [[ "$(jq -r '.id' "$complete_release")" == "$release_id" ]]
            [[ "$(jq -r '.tag_name' "$complete_release")" == "$tag" ]]
            [[ "$(jq -r '.draft' "$complete_release")" == "true" ]]
            archive_count="$(jq '[.assets[] | select((.name | endswith(".zip")) and .state == "uploaded" and .size > 0)] | length' "$complete_release")"
            pcvr_count="$(jq '[.assets[] | select(.name == "manifest-pcvr.json" and .state == "uploaded" and .size > 0)] | length' "$complete_release")"
            quest_count="$(jq '[.assets[] | select(.name == "manifest-quest.json" and .state == "uploaded" and .size > 0)] | length' "$complete_release")"
            uploaded_size="$(jq -r '[.assets[] | select(.name | endswith(".zip"))][0].size // 0' "$complete_release")"
            uploaded_digest="$(jq -r '[.assets[] | select(.name | endswith(".zip"))][0].digest // ""' "$complete_release" | tr '[:upper:]' '[:lower:]')"
            [[ "$archive_count" == "1" && "$pcvr_count" == "1" && "$quest_count" == "1" ]]
            [[ "$uploaded_size" == "$expected_size" ]]
            [[ "$uploaded_digest" == "sha256:${expected_hash}" ]]

            publish_payload="$work/publish-$channel.json"
            printf '%s\n' '{"draft":false}' > "$publish_payload"
            published_release="$work/published-$channel.json"
            gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
              --input "$publish_payload" > "$published_release"
            [[ "$(jq -r '.id' "$published_release")" == "$release_id" ]]
            [[ "$(jq -r '.tag_name' "$published_release")" == "$tag" ]]
            [[ "$(jq -r '.draft' "$published_release")" == "false" ]]

            # Releases created with GitHub's workflow token do not emit another release workflow.
            # Dispatch only after the draft has all three verified assets and is public.
            dispatch_discord "$tag"
          done

          # GitHub does not provide a rename button for release assets in its normal UI, but its
          # release API can safely rename the asset without changing its bytes or digest. Backfill
          # every mirrored WristHub release so old sequence-only names disappear as well.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | \
            grep -E '^wristhub-(stable|beta|dev)-[0-9]+$' | while read -r tag; do
              release_json="$work/release.json"
              gh api "repos/$GH_REPO/releases/tags/$tag" > "$release_json"
              manifest_url="$(jq -r '.assets[] | select(.name == "manifest-pcvr.json") | .browser_download_url' "$release_json" | head -n1)"
              [[ -n "$manifest_url" ]] || continue
              manifest="$work/backfill-manifest.json"
              curl --fail --location --silent --show-error --retry 3 "$manifest_url" -o "$manifest"

              version="$(jq -r '.version' "$manifest")"
              channel="$(cut -d- -f2 <<<"$tag")"
              if [[ "$channel" == "stable" ]]; then
                friendly_name="WristHub-v${version}-Official-Release.zip"
              else
                build="$(jq -r '.releaseLabel' "$manifest" | sed -nE 's/.*DEV BUILD ([0-9]+).*/\1/ip')"
                [[ -n "$build" ]] || continue
                friendly_name="WristHub-v${version}-Dev-Build-${build}.zip"
              fi

              asset_id="$(jq -r --arg name "$friendly_name" \
                '[.assets[] | select(.name | endswith(".zip")) | select(.name != $name)][0].id // empty' \
                "$release_json")"
              if [[ -n "$asset_id" ]]; then
                echo "Renaming $tag package to $friendly_name"
                gh api --method PATCH "repos/$GH_REPO/releases/assets/$asset_id" \
                  -f name="$friendly_name" >/dev/null
              fi
            done
