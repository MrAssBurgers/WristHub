name: Announce WristHub releases to Discord

on:
  release:
    types: [published]
  repository_dispatch:
    types: [wristhub-release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing WristHub release tag to announce
        required: true
        type: string

permissions:
  # The workflow appends one invisible per-tag receipt to the release body after Discord accepts
  # the webhook. That durable receipt makes release, mirror, and manual recovery triggers converge
  # on exactly one announcement.
  contents: write

concurrency:
  group: discord-release-${{ github.event.release.tag_name || github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    env:
      # Keep this filter inside the workflow so the public release-only repository does not need
      # to expose or check out the private WristHub source tree. The service regression test loads
      # this exact module from the YAML, so the behavior tested below is the behavior Discord runs.
      WRISTHUB_RELEASE_NOTES_FILTER_SCRIPT: |
        import { readFileSync, writeFileSync } from "node:fs";
        import { resolve } from "node:path";
        import { fileURLToPath } from "node:url";

        const FALLBACK = "WristHub update. Open the release page for the complete player-facing details.";
        const START_MARKER = "<!-- wristhub-public-notes:start -->";
        const END_MARKER = "<!-- wristhub-public-notes:end -->";
        const WATCH_START_MARKER = "<!-- wristhub-watch-notes:start -->";
        const WATCH_END_MARKER = "<!-- wristhub-watch-notes:end -->";
        const CHANGELOG_START_MARKER = "<!-- wristhub-changelog-notes:start -->";
        const CHANGELOG_END_MARKER = "<!-- wristhub-changelog-notes:end -->";
        const PRIVATE_HEADING = /^(?:internal(?: notes?)?|developer(?: notes?)?|implementation(?: details?)?|build(?: details?| status| output| chatter)?|ci|pipeline|workflow|verification|test(?:ing| results?)?|diagnostics?|logs?|stack traces?|crash analysis|root cause|third[- ]party(?: issues?| errors?| diagnostics?)?|known external issues?)$/i;
        const THIRD_PARTY_COMPONENT = /\b(?:modiomodnetworker|mod[ .-]?io mod networker|qb inventory|nicksclient|fusionimpersonator|awesome\s*sauce)\b/i;
        const THIRD_PARTY_DIAGNOSIS = /(?:\b(?:another|external|third[- ]party)\s+mod\b.*\b(?:error|exception|fault|crash|stack|log)|\b(?:error|exception|fault|crash|stack|log)\b.*\b(?:another|external|third[- ]party)\s+mod\b)/i;
        const GENERIC_EXTERNAL_FAILURE = /(?:\b[a-z0-9_.-]+(?:mod|plugin|networker)\b.{0,80}\b(?:broken|caused?|crash(?:ed)?|error|exception|failed?|fault|issue|problem|threw)\b|\b(?:broken|caused?|crash(?:ed)?|error|exception|failed?|fault|issue|problem|threw)\b.{0,80}\b[a-z0-9_.-]+(?:mod|plugin|networker)\b)/i;
        const OWNED_CHANGE_PREFIX = /^(?:fixed|prevents?|protected|worked around|improved|added|restored|updated|wristhub\b)/i;
        const RAW_DIAGNOSTIC = /^(?:\[(?:error|warn(?:ing)?|fatal|exception)\]|(?:error|warn(?:ing)?|fatal|exception)\s*:|(?:system\.)?[a-z0-9_.]+exception\b|at\s+[a-z0-9_.<>`]+\s*\(|---+\s*(?:end of )?stack trace)/i;
        const INTERNAL_CHATTER = /(?:^(?:internal|developer note|build log|verification|test results?)\s*:|\b(?:build|compil(?:e|ed|ation)|compiler|tests?|test suite|ci|pipeline|workflow|artifact|manifest|sha-?256|checksum|release sequence|version bump|commit|deployment|publish(?:ing)?|upload)\b.{0,45}\b(?:passed|green|complete(?:d)?|succeed(?:ed)?|failed|generated|verified|validated|uploaded|published|deployed)\b|\b(?:passed|green|complete(?:d)?|succeed(?:ed)?|failed|generated|verified|validated|uploaded|published|deployed)\b.{0,45}\b(?:build|compilation|tests?|ci|pipeline|workflow|artifact|manifest|deployment)\b)/i;
