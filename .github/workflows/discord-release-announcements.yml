name: Announce WristHub releases to Discord

on:
  release:
    types: [published]
  repository_dispatch:
    types: [wristhub-release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing WristHub release tag to announce
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: discord-release-${{ github.event.release.tag_name || github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post the release to the matching Discord channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISCORD_DEV_BUILDS_WEBHOOK: ${{ secrets.DISCORD_DEV_BUILDS_WEBHOOK }}
          DISCORD_NEW_RELEASES_WEBHOOK: ${{ secrets.DISCORD_NEW_RELEASES_WEBHOOK }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          MANUAL_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${DISPATCH_TAG:-${MANUAL_TAG:-}}}"
          [[ -n "$tag" ]]

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          release="$work/release.json"
          gh api "repos/$GH_REPO/releases/tags/$tag" > "$release"

          title="$(jq -r '.name // .tag_name' "$release")"
          notes="$(jq -r '.body // "WristHub update"' "$release" | head -c 3500)"
          release_url="$(jq -r '.html_url' "$release")"
          download_url="$(jq -r '[.assets[] | select(.name | endswith(".zip"))][0].browser_download_url // .html_url' "$release")"
          prerelease="$(jq -r '.prerelease' "$release")"

          # The WristHub channel encoded in a mirrored tag is authoritative. This prevents a
          # mistakenly toggled GitHub prerelease checkbox on a dev/beta tag from pinging everyone.
          if [[ "$tag" == wristhub-stable-* ]] || \
             [[ "$tag" != wristhub-dev-* && "$tag" != wristhub-beta-* && "$prerelease" == "false" ]]; then
            webhook="${DISCORD_NEW_RELEASES_WEBHOOK:-}"
            heading="NEW WRISTHUB RELEASE"
            color=3066993
            mention="@everyone"
            allowed_mentions='{"parse":["everyone"]}'
          else
            webhook="${DISCORD_DEV_BUILDS_WEBHOOK:-}"
            heading="NEW WRISTHUB DEV BUILD"
            color=3447003
            # Discord resolves role pings only from the role snowflake syntax. Keep the role ID
            # explicit so every dev build reaches the real WristHub Beta Tester role instead of
            # posting a plain-text @betatesters string that notifies nobody.
            beta_testers_role_id="1534288973399068843"
            mention="<@&${beta_testers_role_id}>"
            allowed_mentions="$(jq -cn --arg role "$beta_testers_role_id" \
              '{parse:[],roles:[$role]}')"
          fi

          if [[ -z "$webhook" ]]; then
            echo "The matching Discord webhook secret is not configured; the GitHub release remains published."
            exit 0
          fi

          payload="$work/discord.json"
          jq -n \
            --arg heading "$heading" \
            --arg title "$title" \
            --arg notes "$notes" \
            --arg release_url "$release_url" \
            --arg download_url "$download_url" \
            --arg mention "$mention" \
            --argjson allowed_mentions "$allowed_mentions" \
            --argjson color "$color" \
            '{
              content: $mention,
              username: "WristHub Release Bot",
              embeds: [{
                title: ($heading + " • " + $title),
                url: $release_url,
                description: $notes,
                color: $color,
                fields: [{name:"Download",value:("[Get the complete WristHub package](" + $download_url + ")")}],
                footer: {text:"Published automatically from the official WristHub GitHub"},
                timestamp: (now | todateiso8601)
              }],
              allowed_mentions: $allowed_mentions
            }' > "$payload"

          curl --fail --silent --show-error --retry 3 \
            -H "Content-Type: application/json" \
            --data-binary "@$payload" \
            "${webhook}?wait=true" >/dev/null
          echo "Discord announcement posted for $tag."

